# git-cliff configuration (https://git-cliff.org/docs/configuration).
# `just release` reads it to compute the next semantic version from the
# conventional commits since the last tag and to write CHANGELOG.md.

[changelog]
header = """
# Changelog

All notable changes to pandoc-config. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and versions follow
[Semantic Versioning](https://semver.org/spec/v2.0.0.html). `just release`
generates this file from the commit history with git-cliff.\n
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**BREAKING** {% endif %}{% if commit.scope %}*({{ commit.scope }})* {% endif %}{{ commit.message | split(pat="\n") | first | trim }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}\n
"""
footer = """
{% for release in releases -%}
{% if release.version and release.previous and release.previous.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/dzackgarza/pandoc-config/compare/{{ release.previous.version }}...{{ release.version }}
{% elif release.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/dzackgarza/pandoc-config/tree/{{ release.version }}
{% endif -%}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
# Keep commits that are not conventional; they go to "Other".
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
topo_order = false
sort_commits = "oldest"
commit_parsers = [
    { field = "raw_message", pattern = "^[Mm]erge", skip = true },
    { field = "raw_message", pattern = "^chore\\(release\\)", skip = true },
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Refactoring" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^test", group = "<!-- 5 -->Tests" },
    { message = "^(chore|build|ci|style)", group = "<!-- 6 -->Maintenance" },
    { message = ".*", group = "<!-- 7 -->Other" },
]

[bump]
# A breaking change before 1.0.0 would bump the minor version; this
# repository is past 1.0.0, so a breaking change bumps the major version.
breaking_always_bump_major = true
