[project]
name = "pandoc-config"
version = "0.1.0"
description = "Shared Pandoc and LaTeX configuration utilities"
requires-python = ">=3.14"
dependencies = [
    "cyclopts>=4.5.1",
    "pydantic>=2.12.5",
]

[project.scripts]
expand-macros = "pandoc_config.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pandoc_config"]
